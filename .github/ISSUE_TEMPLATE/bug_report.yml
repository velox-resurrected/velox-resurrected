name: I found a bug!
description: "Report a modpack bug here. Make sure you have checked and made sure it isn't a known mod issue by checking their issues page."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this bug report, it helps Velox grow and improve!
        
  - type: input
    id: bug
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is. Explain what happened, and what should have happened instead. Add images, screenshots, or videos if they could be useful.
    validations:
      required: true
      
    - type: input
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: Step 1: Place this item... Step 2: Then do...
    validations:
      required: true
      
  - type: textarea
    id: suspect
    attributes:
      label: Suspected mod at issue.
      description: Is it a mod causing the issue, an item from a mod not working correctly? If it is just a modpack recipe issue, then just include Velox. Be sure to also create a bug report with the mod at issue too, and link back here.
      placeholder: Velox
    validations:
      required: true
      
  - type: dropdown
    id: version
    attributes:
      label: Minecraft Version
      description: What version of Minecraft are you running?
      options:
        - 1.20.1 (Velox Resurrected)
        - 1.18.2 (Velox Classic)
      default: 0
    validations:
      required: true
      
  - type: input
    attributes:
      label: Game Log
      description: >
        We need the game log for additional information about the bug.
        This file can be found in the \"logs\" folder of your Minecraft folder as \"latest.log\".
        Please upload the file to https://mclo.gs/ and put the link here.
        Also, if your game is crashing, include your most recent crash(today's date), which can be found in \"crash-logs\" folder.
        Do **not** paste the *contents* of either file here, because that will make this issue very hard to read.
    validations:
      required: true
      
  - type: checkboxes
    id: terms
    attributes:
      label: Double Checked
      description: Before you submit, for non-modpack issues, make sure you report it directly to the mod author and link it in your report. Insure you have included any appropriate files or attachments.
      options:
        - label: I have reviewed this report, and confirmed I have filled out all required info, and attached log files.
          required: true
